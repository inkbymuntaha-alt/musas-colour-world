<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#29134f"><title>Living Sparkle Toy Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui, sans-serif;color:#2c1950;background:linear-gradient(135deg,#fff1fa,#e9e0ff 55%,#d9f3ff);min-height:100vh}.top{background:#29134f;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.top b{font-size:19px}.top small{display:block;letter-spacing:3px;font-size:9px;color:#e4caff}.layout{max-width:1200px;margin:auto;padding:12px;display:grid;grid-template-columns:210px 1fr;gap:12px}.panel{background:#ffffffd9;border:1px solid white;border-radius:18px;padding:12px;box-shadow:0 8px 25px #48247718}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:70vh;overflow:auto}.design{border:2px solid transparent;border-radius:12px;padding:8px 4px;background:#f1e8ff;color:#45286d;font-weight:700;font-size:11px}.design.active{border-color:#8c58dc}.design span{display:block;font-size:24px}.main{min-width:0}.head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.head h2{margin:0;font-size:24px}.modes,.actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.button{border:0;border-radius:12px;background:#f0e7ff;color:#43266f;padding:9px 11px;font-weight:800;box-shadow:0 2px 0 #d5c3ef}.button.active{background:#6336b5;color:white}.button:active{transform:translateY(1px)}.canvasbox{height:min(58vh,560px);min-height:280px;position:relative;background:white;border:2px solid #e5d6fb;border-radius:18px;overflow:hidden;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#301653df;color:white;border-radius:20px;padding:7px 12px;font-size:11px;white-space:nowrap;pointer-events:none}.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.swatch{height:30px;border:3px solid white;border-radius:50%;box-shadow:0 1px 4px #3335}.swatch.sel{outline:3px solid #6738b6}.shelf{display:flex;gap:7px;overflow:auto;margin:8px 0}.sticker{min-width:54px;height:54px;border:2px solid #decdf8;border-radius:12px;background:white;font-size:28px}.cheer{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:20px;background:linear-gradient(90deg,#ff68b2,#9060e7,#38bde9);color:white;font-weight:900;opacity:0;transition:.2s;max-width:94%;text-align:center;pointer-events:none}.cheer.show{opacity:1}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{font-size:12px;font-weight:700}.row input{width:90px;vertical-align:middle}.foot{text-align:center;font-size:10px;padding:10px;color:#806b9b}@media(max-width:700px){.layout{grid-template-columns:1fr;padding:8px;gap:8px}.gallery{display:flex;max-height:none;overflow-x:auto}.design{min-width:82px}.canvasbox{height:44vh;min-height:260px}.head h2{font-size:20px}.palette{grid-template-columns:repeat(8,1fr)}}
</style></head><body>
<header class="top"><div><b>✦ Living Sparkle</b><small>TOY STUDIO</small></div><button class="button" id="sound">🔊 Sound</button></header>
<div class="layout"><aside class="panel"><b>✧ Choose a creation</b><div class="gallery" id="gallery"></div></aside>
<main class="panel main"><div class="head"><div><small>YOUR MAGIC WORKSHOP</small><h2 id="title">Rocket Adventure</h2></div></div>
<div class="modes"><button class="button active" data-mode="colour">🎨 Colour</button><button class="button" data-mode="glitter">✨ Glitter</button><button class="button" data-mode="foil">🌟 Foil Scratch</button><button class="button" data-mode="play">🚀 Play</button><button class="button" data-mode="build">🧩 Build</button></div>
<div class="canvasbox" id="box"><canvas id="art"></canvas><div id="cheer" class="cheer"></div><div id="hint" class="hint">Tap a shape to colour it, or draw with your finger</div></div>
<div class="actions"><button class="button" id="undo">↶ Undo</button><button class="button" id="redo">↷ Redo</button><button class="button" id="reset">⌫ Reset</button><button class="button" id="save">＋ Save Sticker</button><button class="button" id="png">⬇ PNG</button></div>
<section class="panel" style="padding:10px"><div class="row" style="justify-content:space-between"><b>Pick your magic colour</b><span id="colourName">Bubblegum</span></div><div class="palette" id="palette"></div><div class="row" style="margin-top:9px"><label>Brush <input id="brush" type="range" min="3" max="35" value="12"></label><label>Glitter <input id="glitter" type="range" min="2" max="25" value="9"></label></div><div id="shelfTitle" class="hidden"><b>My Sticker Shelf</b><div class="shelf" id="shelf"></div><div class="row"><button class="button" id="smaller">－ Size</button><button class="button" id="bigger">＋ Size</button><button class="button" id="rotate">⟳ Rotate</button><button class="button" id="remove">✕ Remove</button></div></div></section>
</main></div><div class="foot">Made for big imaginations ✦ No external images, fonts or audio files</div>
<script>
(()=>{const $=id=>document.getElementById(id),c=$("art"),x=c.getContext("2d"),box=$("box");
const data=[["Rocket Adventure","🚀"],["Butterfly Garden","🦋"],["Dinosaur Valley","🦕"],["Ocean Submarine","🐠"],["Dream Castle","🏰"],["Race Car Rally","🏎️"],["Hot Air Balloon","🎈"],["Robot Buddy","🤖"],["Swan Lake","🦢"],["Space Explorer","🪐"],["Fire Engine","🚒"],["Magic Unicorn","🦄"],["Jungle Parrot","🦜"],["Train Journey","🚂"],["Fairy Mushroom","🍄"],["Dolphin Splash","🐬"],["Airplane Pilot","✈️"],["Friendly Dragon","🐉"],["Rainbow Kite","🪁"],["Turtle Island","🐢"],["Penguin Party","🐧"],["Flower Fountain","🌷"],["Pirate Ship","⛵"],["Moon Rover","🌙"],["Bee Blossom","🐝"],["Elephant Parade","🐘"],["Rocket Bike","🚲"],["Whale Song","🐳"],["Windmill Farm","🌻"],["Jellyfish Glow","🪼"],["Snowy Cabin","🏡"],["Dancing Cactus","🌵"],["Helicopter Hero","🚁"],["Peacock Palace","🦚"],["Volcano Island","🌋"],["Guitar Jam","🎸"],["Ladybug Lane","🐞"],["Magic Lantern","🏮"],["Safari Jeep","🚙"],["Shooting Star","🌠"],["Coral Castle","🪸"],["Candy Carousel","🎠"],["Owl Treehouse","🦉"],["Waterfall Wonder","💧"],["Snowflake Sled","🛷"],["Treasure Chest","🧰"],["Little Lighthouse","🗼"],["Garden Tractor","🚜"],["Cloud Airship","☁️"],["Starry Garden","⭐"]];
const colours=[["Bubblegum","#ff72b6"],["Cherry","#ef405b"],["Tangerine","#ff963d"],["Sunshine","#ffd83e"],["Lime","#9edb48"],["Mint","#4bd6ae"],["Ocean","#3db9e8"],["Sky","#73aaff"],["Blueberry","#6565d9"],["Violet","#a46be8"],["Plum","#c26ac8"],["Chocolate","#94604c"],["Silver","#bdc7d6"],["Gold","#e7b83f"],["White","#fff"],["Midnight","#30304d"]];
const praise=[];const a=["WOW","YAY","BRAVO","SUPER","AMAZING","FANTASTIC","HOORAY","MAGNIFICENT","SENSATIONAL","WONDERFUL","INCREDIBLE","GENIUS","MARVELLOUS","OUTSTANDING","SPECTACULAR","FABULOUS","BRILLIANT","PHENOMENAL","GLORIOUS","EPIC"],b=["your colours are dancing","that sparkle is magical","you made something special","your imagination is shining","those details are delightful","you brought the page to life","your masterpiece is blooming","that was a clever idea","your creativity is soaring","you made the stars smile","your art has its own magic","every little detail shines"],d=["keep creating","what a happy masterpiece","you are an art superstar","let your imagination fly","that deserves a big cheer","the studio is sparkling","you made today brighter","your ideas are pure magic","another brilliant creation","the fun has just begun","your talent is shining bright","time for a victory wiggle"];a.forEach((v,i)=>b.forEach((w,j)=>praise.push(v+" — "+w+"; "+d[(i*7+j*5)%12]+"!")));
let design=0,mode="colour",col=colours[0][1],brush=12,glit=9,W=0,H=0,down=false,last=null,paths=[],foil=[],stickers=[],sel=-1,undo=[],redo=[],audioCtx=null,sound=true;
function safeGet(){try{return JSON.parse(localStorage.getItem("livingSparkleStickers")||"[]")}catch(e){return[]}}function safeSet(v){try{localStorage.setItem("livingSparkleStickers",JSON.stringify(v))}catch(e){}}
function size(){let r=box.getBoundingClientRect();W=r.width;H=r.height;let ratio=Math.min(devicePixelRatio||1,2);c.width=W*ratio;c.height=H*ratio;x.setTransform(ratio,0,0,ratio,0,0);draw()}new ResizeObserver(size).observe(box);
function save(){undo.push(JSON.stringify({paths,foil,stickers}));if(undo.length>25)undo.shift();redo=[]}
function outline(){x.clearRect(0,0,W,H);x.fillStyle="#fffdfd";x.fillRect(0,0,W,H);let cx=W/2,cy=H/2,s=Math.min(W/600,H/430);x.save();x.translate(cx,cy);x.scale(s,s);x.lineWidth=5;x.strokeStyle="#40304e";x.lineJoin="round";let type=design%8;const shapes=[[["roundRect",-120,-80,240,160,40],["circle",0,-80,42],["triangle",0,155,65]],[["circle",-100,-55,80],["circle",100,-55,80],["ellipse",0,70,140,65],["rect",0,5,20,170]],[["ellipse",0,10,150,90],["circle",110,-65,50],["triangle",-40,-105,55],["triangle",20,-120,55]],[["roundRect",-150,-60,300,130,65],["circle",-80,-60,28],["circle",0,-60,28],["circle",80,-60,28]],[["rect",-130,5,260,150],["triangle",-130,-100,65],["triangle",130,-100,65],["triangle",0,-140,85]],[["circle",0,0,120],["petal",-110,-80,65,90],["petal",110,-80,65,90],["star",0,-155,40]],[["ellipse",0,10,150,95],["triangle",0,-110,60],["triangle",150,35,45],["circle",-80,-10,18]],[["circle",0,0,110],["star",-130,-120,40],["star",130,-120,40],["petal",-70,135,45,70],["petal",70,135,45,70]]];const sh=shapes[type];sh.forEach((q,i)=>{x.beginPath();let [t,...v]=q;if(t==="circle")x.arc(v[0],v[1],v[2],0,7);else if(t==="ellipse")x.ellipse(v[0],v[1],v[2],v[3],0,0,7);else if(t==="rect")x.rect(v[0]-v[2]/2,v[1]-v[3]/2,v[2],v[3]);else if(t==="roundRect")x.roundRect(v[0]-v[2]/2,v[1]-v[3]/2,v[2],v[3],v[4]);else if(t==="triangle"){x.moveTo(v[0],v[1]-v[2]);x.lineTo(v[0]+v[2],v[1]+v[2]);x.lineTo(v[0]-v[2],v[1]+v[2]);x.closePath()}else if(t==="star"){for(let k=0;k<10;k++){let ang=-Math.PI/2+k*Math.PI/5,rr=k%2?v[2]*.45:v[2],px=v[0]+Math.cos(ang)*rr,py=v[1]+Math.sin(ang)*rr;k?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}else if(t==="petal")x.ellipse(v[0],v[1],v[2],v[3],0,0,7);x.fillStyle="#fff";x.fill();x.stroke()});x.restore();paths.forEach(p=>{x.strokeStyle=p.c;x.lineWidth=p.w;x.lineCap="round";x.beginPath();p.pts.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.stroke()});if(mode==="foil"){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#c7d2e0");g.addColorStop(.3,"#fff");g.addColorStop(.6,"#b8c7d9");g.addColorStop(1,"#f5dfff");x.fillStyle=g;x.fillRect(0,0,W,H);x.globalCompositeOperation="destination-out";x.lineWidth=36;x.lineCap="round";foil.forEach(p=>{x.beginPath();p.forEach((q,i)=>i?x.lineTo(q.x,q.y):x.moveTo(q.x,q.y));x.stroke()});x.globalCompositeOperation="source-over"}if(mode==="glitter")paths.filter(p=>p.glitter).forEach(p=>p.pts.forEach((q,i)=>{if(i%3===0){x.fillStyle="#fff4a8";x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}}));stickers.forEach((s,i)=>{x.save();x.translate(s.x*W,s.y*H);x.rotate(s.r);x.font=(56*s.z)+"px serif";x.textAlign="center";x.fillText(s.emoji,0,0);x.restore();if(i===sel&&mode==="build"){x.strokeStyle="#8b50d5";x.setLineDash([5,4]);x.strokeRect(s.x*W-36,s.y*H-36,72,72);x.setLineDash([])}})}
function draw(){outline()}function cheer(){let n=praise[Math.floor(Math.random()*praise.length)],el=$("cheer");el.textContent=n;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),3000);if(sound){try{let A=window.AudioContext||window.webkitAudioContext;if(!audioCtx)audioCtx=new A();let t=audioCtx.currentTime;for(let i=0;i<20;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=400+Math.random()*1200;g.gain.setValueAtTime(.0001,t+i*.03);g.gain.exponentialRampToValueAtTime(.035,t+i*.03+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.03+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.03);o.stop(t+i*.03+.16)}}catch(e){}try{let u=new SpeechSynthesisUtterance(n);u.pitch=1.5;u.rate=1.12;speechSynthesis.speak(u)}catch(e){}}}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,nx:(e.clientX-r.left)/r.width,ny:(e.clientY-r.top)/r.height}}
c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);down=true;last=pos(e);if(mode==="build"){sel=stickers.findIndex(s=>Math.hypot(s.x*W-last.x,s.y*H-last.y)<48);draw();return}save();if(mode==="foil")foil.push([{x:last.x,y:last.y}]);else paths.push({c:col,w:mode==="glitter"?glit:brush,glitter:mode==="glitter",pts:[last]});if(mode==="play"){cheer();down=false}};
c.onpointermove=e=>{if(!down)return;let p=pos(e);if(mode==="build"&&sel>=0){stickers[sel].x=p.nx;stickers[sel].y=p.ny}else if(mode==="foil")foil[foil.length-1].push(p);else if(paths.length)paths[paths.length-1].pts.push(p);last=p;draw()};c.onpointerup=c.onpointercancel=()=>{down=false};
const gallery=$("gallery");data.forEach((v,i)=>{let b=document.createElement("button");b.className="design";b.innerHTML="<span>"+v[1]+"</span>"+v[0];b.onclick=()=>{design=i;$("title").textContent=v[0];gallery.querySelectorAll("button").forEach(q=>q.classList.remove("active"));b.classList.add("active");paths=[];foil=[];stickers=[];draw()};gallery.appendChild(b);if(!i)b.classList.add("active")});
colours.forEach((v,i)=>{let b=document.createElement("button");b.className="swatch"+(!i?" sel":"");b.style.background=v[1];b.title=v[0];b.onclick=()=>{col=v[1];$("colourName").textContent=v[0];document.querySelectorAll(".swatch").forEach(q=>q.classList.remove("sel"));b.classList.add("sel")};$("palette").appendChild(b)});
document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll("[data-mode]").forEach(q=>q.classList.toggle("active",q===b));$("hint").textContent=({colour:"Tap a shape to colour it, or draw with your finger",glitter:"Draw a trail of sparkles!",foil:"Scratch the shiny foil to reveal the artwork",play:"Tap your creation for a celebration!",build:"Drag your stickers around the scene"})[mode];$("shelfTitle").classList.toggle("hidden",mode!=="build");draw()});
$("brush").oninput=e=>brush=+e.target.value;$("glitter").oninput=e=>glit=+e.target.value;
$("undo").onclick=()=>{if(!undo.length)return;redo.push(JSON.stringify({paths,foil,stickers}));let s=JSON.parse(undo.pop());paths=s.paths;foil=s.foil;stickers=s.stickers;draw()};$("redo").onclick=()=>{if(!redo.length)return;undo.push(JSON.stringify({paths,foil,stickers}));let s=JSON.parse(redo.pop());paths=s.paths;foil=s.foil;stickers=s.stickers;draw()};
$("reset").onclick=()=>{save();paths=[];foil=[];stickers=[];draw()};
function refresh(){let shelf=$("shelf");shelf.innerHTML="";safeGet().forEach(s=>{let b=document.createElement("button");b.className="sticker";b.textContent=s.emoji;b.onclick=()=>{stickers.push({emoji:s.emoji,x:.5,y:.5,z:1,r:0});sel=stickers.length-1;draw()};shelf.appendChild(b)})}
$("save").onclick=()=>{let v=safeGet();v.unshift({emoji:data[design][1]});safeSet(v.slice(0,50));refresh();mode="build";document.querySelector('[data-mode="build"]').click();cheer()};
$("smaller").onclick=()=>{if(sel>=0)stickers[sel].z=Math.max(.5,stickers[sel].z-.15);draw()};$("bigger").onclick=()=>{if(sel>=0)stickers[sel].z=Math.min(2,stickers[sel].z+.15);draw()};$("rotate").onclick=()=>{if(sel>=0)stickers[sel].r+=.3;draw()};$("remove").onclick=()=>{if(sel>=0)stickers.splice(sel,1);sel=-1;draw()};$("png").onclick=()=>{try{let a=document.createElement("a");a.download="living-sparkle-creation.png";a.href=c.toDataURL("image/png");a.click()}catch(e){alert("PNG export is unavailable in this browser.")}};
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 Sound":"🔇 Muted";if(!sound)try{speechSynthesis.cancel()}catch(e){}};refresh();size();
})();</script></body></html>
